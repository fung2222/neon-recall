<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05010f">
<meta name="description" content="霓虹記憶 NEON RECALL — 3D 賽博朋克記憶配對遊戲。翻開霓虹卡牌，記住圖案，配對成功。冇時間限制。">
<title data-i18n="doc.title">霓虹記憶 NEON RECALL · 賽博朋克 3D 記憶配對</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%2305010f%22/%3E%3Crect x=%225%22 y=%224%22 width=%2210%22 height=%2214%22 rx=%222%22 fill=%22none%22 stroke=%22%2300e5ff%22 stroke-width=%222%22/%3E%3Crect x=%2217%22 y=%2214%22 width=%2210%22 height=%2214%22 rx=%222%22 fill=%22none%22 stroke=%22%23ff2bd6%22 stroke-width=%222%22/%3E%3Cpath d=%22M22 17l-3 5h3l-2 4%22 stroke=%22%23fff35c%22 fill=%22none%22 stroke-width=%221.6%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/cyber-kit/ui/hud.css">
<link rel="stylesheet" href="./css/game.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/cyber-kit/three/three.module.min.js",
    "three/addons/": "./vendor/cyber-kit/three/addons/",
    "cyber-kit": "./vendor/cyber-kit/kit.js",
    "cyber-kit/": "./vendor/cyber-kit/"
  }
}
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="fx-flash"></div>
<div id="scanlines"></div>

<div id="hud" class="hidden">
  <div class="hud-panel hud-left">
    <div class="stat"><div class="label" data-i18n="score"></div><div class="value big" id="hud-score">0</div></div>
    <div class="stat"><div class="label" data-i18n="best"></div><div class="value" id="hud-best">0</div></div>
  </div>
  <div class="hud-panel hud-right">
    <div class="stat"><div class="label" data-i18n="level"></div><div class="value big" id="hud-level">1</div></div>
    <div class="stat"><div class="label" data-i18n="combo"></div><div class="value" id="hud-combo">×0</div></div>
  </div>
  <div class="hud-center">
    <div class="level-progress">
      <div class="lp-head"><span class="lp-title" data-i18n="pairs"></span><span id="hud-pairs">0 / 4</span></div>
      <div class="lp-bar"><div class="lp-fill" id="hud-progress"></div></div>
    </div>
    <div class="zone-name" id="hud-zone-name">霓虹九龍</div>
  </div>
  <div class="df-bar">
    <button id="btn-peek" class="df-undo" data-i18n-attr="title:peekTip,aria-label:peek">
      <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke-width="2"/></svg>
      <span class="df-undo-txt"><b data-i18n="peek"></b><small data-i18n="peekS"></small></span>
      <span class="df-badge" id="peek-badge">1</span>
    </button>
    <div class="hud-buttons">
      <button id="btn-restart" class="icon-btn" data-i18n-attr="title:restartTip,aria-label:restartTip">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7" fill="none" stroke-width="2.2"/><path d="M20 4v5h-5" fill="none" stroke-width="2.2"/></svg>
      </button>
      <button id="btn-pause" class="icon-btn" data-i18n-attr="title:pauseTip,aria-label:pauseTip">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
      </button>
      <button id="btn-mute" class="icon-btn" data-i18n-attr="title:muteTip,aria-label:muteTip">
        <svg class="ico-on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke-width="2"/></svg>
      </button>
    </div>
  </div>
  <div id="demo-tag" class="demo-tag hidden" data-i18n="kit.demo"></div>
  <div id="fps" class="fps hidden">-- FPS</div>
</div>

<div id="screen-start" class="screen hero">
  <div class="panel">
    <div class="kicker">NEON KOWLOON · MEMORY CORE</div>
    <h1 class="title glitch" data-text="霓虹記憶" data-i18n="title">霓虹記憶</h1>
    <div class="title-en" data-i18n="titleEn"></div>
    <p class="tagline" data-i18n-html="tagline"></p>
    <button class="neon-btn" id="btn-continue"><span data-i18n="continue"></span><small id="continue-sub"></small></button>
    <button class="neon-btn" id="btn-start"><span data-i18n="start"></span><small data-i18n="startS"></small></button>
    <div class="controls">
      <div class="touch-hint" data-i18n="touchHint"></div>
      <div data-i18n-html="keysHint"></div>
    </div>
    <div class="hi-line"><span data-i18n="best"></span> <b id="start-best">0</b>　<span data-i18n="bestLevel"></span> <b id="start-level">—</b>　<span data-i18n="stars"></span> <b id="start-stars">0</b></div>
    <div class="link-row"><a href="./privacy.html" data-i18n="kit.privacy"></a> · <button class="lang-btn" id="btn-lang"></button></div>
  </div>
</div>

<div id="screen-pause" class="screen hidden">
  <div class="panel small">
    <h2 class="title2 glitch" data-text="已暫停" data-i18n="kit.paused">已暫停</h2>
    <div class="title-en" data-i18n="pausedS"></div>
    <button class="neon-btn" id="btn-resume"><span data-i18n="kit.resume"></span><small>P</small></button>
    <button class="neon-btn ghost" id="btn-quit"><span data-i18n="kit.menu"></span><small data-i18n="saved"></small></button>
    <button class="lang-btn" id="btn-lang2"></button>
  </div>
</div>

<div id="screen-clear" class="screen hidden">
  <div class="panel">
    <div class="kicker" id="clear-kicker">LEVEL 1 CLEAR</div>
    <h2 class="title2 glitch" data-text="記憶同步" data-i18n="synced">記憶同步</h2>
    <div class="title-en" data-i18n="syncedS"></div>
    <div class="stars" id="clear-stars"><i>★</i><i>★</i><i>★</i></div>
    <div class="results">
      <div><span data-i18n="levelScore"></span><b id="clear-score">0</b></div>
      <div><span data-i18n="misses"></span><b id="clear-misses">0</b></div>
      <div><span data-i18n="maxCombo"></span><b id="clear-combo">0</b></div>
      <div><span data-i18n="time"></span><b id="clear-time">0s</b></div>
    </div>
    <button class="neon-btn" id="btn-next"><span data-i18n="next"></span><small data-i18n="nextS"></small></button>
    <button class="neon-btn ghost" id="btn-replay"><span data-i18n="replay"></span><small data-i18n="replayS"></small></button>
    <button class="neon-btn ghost" id="btn-menu"><span data-i18n="kit.menu"></span><small>MENU</small></button>
  </div>
</div>

<div id="loading" class="loading"><div class="ld-text" data-i18n="kit.loading">SYNCING MEMORY CORE…</div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
